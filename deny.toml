# cargo-deny policy (issue #66).
#
# Scope is deliberately narrow: this file exists to make the audit job's
# verdict reproducible and reviewable, not to encode taste. Every deviation
# from cargo-deny's defaults is justified in place (§8) so a future reader can
# refute it rather than guess at intent.

[advisories]
# RUSTSEC advisories are a blocking condition, not a warning: this binary
# reads and indexes a user's entire source tree.
yanked = "deny"
# No blanket ignores. An accepted advisory is added here WITH its RUSTSEC id
# and a written reason, never as a silent list entry.
#
# All three below are `unmaintained`/`unsound` warnings, NOT vulnerabilities,
# and all three are transitive (none appears in this Cargo.toml). Clearing them
# means upgrading tantivy 0.22→0.26 and lbug 0.15→0.18, which are dependency
# migrations with real blast radius (search ranking; on-disk graph format) and
# so are tracked separately in #78 rather than smuggled into a CI change.
# Removing these entries is an acceptance criterion of that issue.
ignore = [
    # instant 0.1.13 is unmaintained. Reached via measure_time <- tantivy 0.22.1.
    "RUSTSEC-2024-0384",
    # lru 0.12.5: IterMut violates Stacked Borrows. Reached via tantivy 0.22.1.
    "RUSTSEC-2026-0002",
    # cxx 1.0.138: let_cxx_string! uses an uninitialized value. Via lbug 0.15.4.
    "RUSTSEC-2026-0202",
]

[licenses]
# Permissive licenses only. This ships as a redistributable binary, so a
# copyleft dependency is a distribution question that must be decided
# deliberately rather than discovered at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"   # advisory: duplicate versions are bloat, not risk
wildcards = "deny"           # a wildcard version defeats Cargo.lock pinning

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
